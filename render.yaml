services:
  - type: web
    name: leadforge-api
    env: docker
    region: ohio
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    # Render probes this port to confirm the service is up.
    # Must match the PORT env var Render injects (default 10000 on free tier).
    port: 10000
    healthCheckPath: /health
    envVars:
      - key: APIFY_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL_OVERRIDE
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: CLOUD_RUN_URL
        sync: false
